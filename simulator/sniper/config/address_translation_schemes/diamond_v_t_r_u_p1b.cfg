# Diamond V+T+R+U with Phase 1b Revelator-as-way-predictor
# =========================================================
# Builds on diamond_v_t_r_u with two added flags:
#   [perf_model/utopia/tiered_hashing] enabled = true
#       Allocator skips region/global-way logic; way 0 fills first.
#   [perf_model/mmu/way_predict] enabled = true
#       MMU fires speculative cache prefetch at PA(set, way=0) on each
#       successful RSW lookup, overlapping with metadata verification.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_fullstack.cfg
#include ./mmu_configs/tlb_hierarchy_shared.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/utopia_4k.cfg
#include ./mmu_configs/trail_aggressive.cfg
#include ./spec_engine_configs/spec_engine_waycast.cfg

# Phase 1b enablers
[perf_model/utopia/tiered_hashing]
enabled = true

[perf_model/mmu/way_predict]
enabled = true

[perf_model/l2_cache]
replacement_policy = srrip

[perf_model/l2_cache/srrip]
tlb_enabled = true

[perf_model/nuca]
replacement_policy = srrip

[perf_model/nuca/cache/srrip]
tlb_enabled = true

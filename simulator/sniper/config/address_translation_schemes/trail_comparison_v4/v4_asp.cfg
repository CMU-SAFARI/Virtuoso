# trail_comparison_v4 :: v4_asp
# Uniform substrate: IP-Stride@L1D (data-only) + Streamer@L2 + CHiRP@L2-TLB,
# ddr4-2400 4ch, meteor_lake P-core, 4-level radix, reserve_thp.  Only the
# L2-TLB MMU/prefetcher config (mmu_base_prefetch) varies across eval points.
#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./prefetcher_configs/datapf_ipstride_notrans_streamer.cfg
#include ./mmu_configs/mmu_base_prefetch.cfg
#include ./mmu_configs/l2tlb_chirp.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

# ---- ASP baseline: simple PC-stride table, sized to match TRAIL's 64-entry
# ---- PC table (fair storage budget). lookahead=4, degree=3.
[perf_model/mmu/tlb_prefetch/pq1/asp_prefetcher]
table_size = 64
prefetch_threshold = 0
extra_prefetch = "true"
lookahead = 4
degree = 3

# Diamond Perfect (normal layout) — translation oracle, baseline mapping
# =======================================================================
# Zero translation cost (perfect TLB, instant PTW), with the SAME physical-
# memory allocator the baseline uses (reserve_thp_4k).  No Utopia hashing,
# no utlb, no Restricted-Segment placement.
#
# Use this cell to isolate the pure translation-cost benefit (TLB misses
# + PTW latency removed) from the PA-remapping benefit Utopia provides
# in diamond_perfect_utopia.cfg.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./mmu_configs/tlb_hierarchy_shared.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp_4k.cfg

# ---- Perfect translation ----
[general]
translation_enabled = true

[perf_model/mmu]
perfect_translation = true
count_page_fault_latency = "false"

# Zero-latency TLB / PWC (paranoid; perfect_translation short-circuits anyway).
[perf_model/mmu/tlb_level_1/tlb1]
access_latency = 0
[perf_model/mmu/tlb_level_1/tlb2]
access_latency = 0
[perf_model/mmu/tlb_level_1/tlb3]
access_latency = 0
[perf_model/mmu/tlb_level_2/tlb1]
access_latency = 0

[perf_model/mmu/pwc]
access_penalty = 0
miss_penalty = 0

# Match the diamond's L2 + NUCA replacement so cache behaviour is comparable.
[perf_model/l2_cache]
replacement_policy = srrip
[perf_model/l2_cache/srrip]
tlb_enabled = true

[perf_model/nuca]
replacement_policy = srrip
[perf_model/nuca/cache/srrip]
tlb_enabled = true

# ============================================================
# CACTI-derived per-core TLB (real-silicon sizes, HASH_MOD)
# ============================================================
[perf_model/mmu/tlb_level_1/tlb1]
size = 96
assoc = 8

[perf_model/mmu/tlb_level_1/tlb2]
size = 48
assoc = 8

[perf_model/mmu/tlb_level_2/tlb1]
size = 2048
assoc = 16
access_latency = 6

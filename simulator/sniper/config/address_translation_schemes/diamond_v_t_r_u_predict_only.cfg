# Phase 1b control: tiered hashing OFF, way prediction ON.
# Measures way-prediction accuracy without the allocator's tiered bias.
# Should show MUCH lower accuracy than the full Phase 1b config.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_fullstack.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/utopia_4k.cfg
#include ./mmu_configs/trail_aggressive.cfg
#include ./spec_engine_configs/spec_engine_revelator_lean.cfg
#include ./spec_engine_configs/revelator_engine_params.cfg

[perf_model/utopia/tiered_hashing]
enabled = false

[perf_model/mmu/way_predict]
enabled = true

[perf_model/l2_cache]
replacement_policy = srrip

[perf_model/l2_cache/srrip]
tlb_enabled = true

[perf_model/nuca]
replacement_policy = srrip

[perf_model/nuca/cache/srrip]
tlb_enabled = true

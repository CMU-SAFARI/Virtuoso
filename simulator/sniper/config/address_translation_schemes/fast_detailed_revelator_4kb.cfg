# Fast Detailed — Revelator 4KB-Only
# ====================================
# Revelator speculative allocator restricted to 4KB pages,
# running under the fast_detailed caching protocol.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration (Meteor Lake P-core)
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration (speculative)
#include ./mmu_configs/mmu_spec.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration — readwrite model, 1 controller, 153 GB/s
#include ./dram_configs/readwrite_1ctrl_153gbps.cfg

# Physical memory allocator (Revelator)
#include ./physical_memory_allocators/revelator_alloc.cfg
#include ./physical_memory_allocators/swap_space.cfg

# Speculative engine
#include ./spec_engine_configs/spec_engine_revelator.cfg

# ---- Override: use fast_detailed caching protocol ----
[caching_protocol]
type = fast_detailed

# ---- L3 cache parameters (fast_detailed reads these directly) ----
[perf_model/l3_cache]
cache_size = 4096            # 4MB LLC (4MB per core)
associativity = 16
data_access_time = 20        # ~20 cycles
shared_cores = 1             # Single-core config

# ---- Disable NUCA (fast_detailed has its own LLC) ----
[perf_model/nuca]
enabled = false

# ---- Use Revelator exception handler ----
[general]
exception_handler_type = "revelator"

# ---- Restrict to 4KB pages only ----
[perf_model/mimicos_host]
number_of_page_sizes = 1
page_size_list = 12

[perf_model/mmu/spec]
number_of_page_sizes = 1
page_size_list = 12

[perf_model/revelator]
target_fragmentation = 1.0

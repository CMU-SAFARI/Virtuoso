# Userspace MimicOS with ReserveTHP Allocator — kratos20 target
# ==============================================================
# Identical structure to userspace_reservethp.cfg but uses the
# Cascade Lake Xeon core model and DDR4-2666 6-channel DRAM model so
# that simulator-measured fault costs can be compared directly to
# Linux fault_bench numbers captured on kratos20.
# See experiments/calibration/host_kratos20.fingerprint for the target.

# Base system (userspace MimicOS enabled)
#include ./common_configs/common_userspace.cfg

# Core and cache configuration — match kratos20 (Xeon Gold 6226R, Cascade Lake-SP)
#include ./core_configs/cascade_lake_xeon.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration — match kratos20 (DDR4-2666, 6-channel per socket)
#include ./dram_configs/ddr4_2666_6ch.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg

# ReserveTHP — sniperspace MimicOS, kratos20-matched
# ===================================================
# Sniperspace MimicOS (runs inside the Sniper simulator) with the same
# Cascade Lake Xeon core + DDR4-2666 6-channel DRAM models as the
# userspace variant, so wall-clock timing comparisons between
# sniperspace and userspace MimicOS are apples-to-apples.

# Base system — note: base_system_sniperspace sets
# enable_userspace_mimicos = false, i.e. MimicOS code runs inside Sniper.
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration — same as userspace_reservethp_kratos20.cfg
#include ./core_configs/cascade_lake_xeon.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration — same as userspace_reservethp_kratos20.cfg
#include ./dram_configs/ddr4_2666_6ch.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg

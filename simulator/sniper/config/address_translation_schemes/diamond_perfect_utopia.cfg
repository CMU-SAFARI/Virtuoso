# Diamond Perfect (Utopia layout) — translation oracle for the diamond
# =====================================================================
# Zero translation cost, BUT physical-memory layout matches P1b/V+T+R+U:
# uses the Utopia allocator with tiered hashing so VPN -> PPN is hashed
# (not contiguous as in reserve_thp).  Removes the bank-conflict trap
# where reserve_thp's contiguous PPN allocation forced multiple loads
# into the same DRAM bank.
#
# With this cfg, Perfect and the V+T+R+U cells share the same address
# layout and DRAM bank distribution.  The only delta is translation cost.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./mmu_configs/tlb_hierarchy_shared.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/utopia_4k.cfg

# Tiered-hashing layout matches P1b's RestSeg placement.
[perf_model/utopia/tiered_hashing]
enabled = true

# Utopia metadata caches (zero latency since perfect_translation skips them).
[perf_model/utopia/tagcache]
size = 8
assoc = 4
access_penalty = 0
miss_penalty = 0

[perf_model/utopia/fpacache]
size = 8
assoc = 4
access_penalty = 0
miss_penalty = 0

[perf_model/utopia/mmu]
disable_fp_tar_caches = true
disable_fp_cache = true
disable_tar_cache = true

[perf_model/utopia]
radix_lookup_enabled = true
access_pattern_logging = false
access_pattern_sample_rate = 1

[perf_model/utopia/utlb]
enabled = true
entries = 4096
assoc = 8
latency = 1

[perf_model/utopia/speculation]
enabled = false
wmax = 4
conf_bits = 3
conf_threshold = 3
conf_table_entries = 16384
way_predictor_enabled = false
lastway_table_entries = 8192
enable_instruction_speculation = false

[perf_model/utopia/migration_cost_topk]
enabled = 0
page_size_bits = 12
score_bits = 10
ptw_base_increment = 1
dram_weighted_increment_cap = 3
topk_entries = 16
sticky_threshold = 2
cooldown_epochs = 2
ranking_epoch_translations = 1024
credit_epoch_translations = 1024
credits_max = 4
credits_refill = 1
migrate_threshold = 32
post_migrate_score_shift = 2

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

[general]
translation_enabled = true

[perf_model/mmu]
perfect_translation = true
count_page_fault_latency = "false"

# Zero-latency TLB / PWC (paranoid; perfect_translation short-circuits anyway).
[perf_model/mmu/tlb_level_1/tlb1]
access_latency = 0
[perf_model/mmu/tlb_level_1/tlb2]
access_latency = 0
[perf_model/mmu/tlb_level_1/tlb3]
access_latency = 0
[perf_model/mmu/tlb_level_2/tlb1]
access_latency = 0

[perf_model/mmu/pwc]
access_penalty = 0
miss_penalty = 0

# Match the diamond's L2 + NUCA replacement so cache behaviour is comparable.
[perf_model/l2_cache]
replacement_policy = srrip
[perf_model/l2_cache/srrip]
tlb_enabled = true

[perf_model/nuca]
replacement_policy = srrip
[perf_model/nuca/cache/srrip]
tlb_enabled = true

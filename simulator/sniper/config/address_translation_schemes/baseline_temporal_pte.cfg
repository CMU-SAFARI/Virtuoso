# Baseline + Temporal PTE Prefetcher
# ====================================
# Standard 4-level radix page table with 4KB pages, ReserveTHP allocator,
# and the Temporal PTE TLB prefetcher enabled.
#
# The temporal PTE prefetcher stores delta+confidence entries in a shadow
# PTE payload word and uses them to predict and prefetch upcoming TLB
# translations.  It learns VPN-to-VPN transition deltas on every access
# and writes them back into the source page's payload.
#
# See config/mmu_configs/mmu_temporal_pte.cfg for all prefetcher knobs.

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration (with temporal PTE prefetcher)
#include ./mmu_configs/mmu_temporal_pte.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400_4channel.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg

# Victima + PWC stress + L2/NUCA SRRIP
# ======================================
# Pair to baseline_pwc_stressed.cfg.  3rd PWC level starved to 1 entry so
# upper-level walks miss in PWC; Victima's leaf-probe should bypass the
# resulting cache hierarchy traffic.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_victima.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

# ---- Stress: kill the entire PWC (1 entry per level) ----
[perf_model/mmu/pwc]
entries = 1, 1, 1
associativity = 1, 1, 1

# ---- L2 + NUCA: SRRIP with TLB-aware sticky priority ----
[perf_model/l2_cache]
replacement_policy = srrip

[perf_model/l2_cache/srrip]
tlb_enabled = true

[perf_model/nuca]
replacement_policy = srrip

[perf_model/nuca/cache/srrip]
tlb_enabled = true

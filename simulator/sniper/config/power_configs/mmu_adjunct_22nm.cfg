# MMU adjunct per-access energies (22nm)
# =======================================
# Used by tools/mcpat.py's compute_mmu_adjunct_energy() to model the energy
# consumed by structures McPAT 1.0 doesn't natively cover:
#   - L2 unified TLB
#   - Page-Walk Cache (PWC) levels
#   - Utopia FPA (fingerprint array), TAR (tag array), UTLB
#   - Victima TLB-block tagging overhead
#
# Numbers are CACTI-style estimates @22nm for small CAM/SRAM structures sized
# to match our cfg (L2 TLB = 2K entries, PWC = 32 entries/level, UTLB = 4K
# entries).  Override per-experiment by including a different file or by
# pasting values into the experiment cfg.
#
# All values in picojoules (pJ) per access.

[power/mmu_adjunct]
l2_tlb_per_access_pj      = 30   # 2K-entry, 8-way unified TLB
pwc_per_access_pj         =  5   # 32-entry PWC level
utopia_fpa_per_access_pj  =  3   # small fingerprint array
utopia_tar_per_access_pj  =  5   # small tag array
utlb_per_access_pj        = 40   # 4K-entry Utopia user TLB
victima_probe_per_access_pj = 8  # Victima TLB-block probe tagging

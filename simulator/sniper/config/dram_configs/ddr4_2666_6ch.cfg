# DDR4-2666 approximating kratos20's 6-channel per-socket memory subsystem
# =========================================================================
# Target: kratos20 (Xeon Gold 6226R) — DDR4 DIMMs rated 3200 MT/s but
# BIOS-configured at 2666 MT/s, 16 DIMMs across 2 sockets × 6 channels.
# Aggregate: 6 × 21.33 GB/s ≈ 128 GB/s peak per socket; typical loaded
# sustained throughput ≈ 100 GB/s.
#
# Sniper limitation: num_channels must be a power of 2 (address-bit
# indexing assumes 2^N channels).  We model 4 channels at higher
# per-channel bandwidth to preserve the aggregate — this slightly
# over-concentrates queueing contention vs a real 6-channel system but
# is the cleanest approximation.  Raw DRAM access latency and JEDEC
# timings are set to DDR4-2666 values regardless of channel count.
#
# Forked from ddr4_2400_4channel.cfg — only speed, per-channel/aggregate
# bandwidth, and timings are changed.

[perf_model/dram]
num_controllers = 1
type = "ddr"
# NOTE: the `ddr` detailed model (DramPerfModelDetailed) IGNORES this
# `latency` field — it is only consumed by the constant/readwrite/normal
# models.  We leave it as a harmless fallback so a mistaken `type=constant`
# in an override still produces sane numbers; the real access latency is
# computed dynamically below from access_cost + bank/controller timings
# + queue_model/basic.  To shift observed loaded latency, tune those
# knobs (access_cost, bank_*_delay, controller_delay), not this one.
latency = 45
per_controller_bandwidth = 100      # GB/s aggregate (DDR4-2666 × 4 eff ch)
chips_per_dimm = 8
dimms_per_controller = 4
localdram_size = 1024

[perf_model/dram/queue_model]
enabled = "true"
type = "basic"

[perf_model/dram/ddr]
num_banks = 32
num_bank_groups = 4
num_ranks = 2                       # typical for CLX populated channels
num_channels = 4                    # power-of-2 approximation of real 6 channels
data_bus_width = 64
dram_speed = 2666
dram_page_size = 128                # in cache lines (8 KB page size)
open_page_mapping = "true"
randomize_address = "false"
randomize_offset = 0
column_bits_shift = 14
bank_keep_open = 120
constant_time_policy = false
selective_constant_time_policy = false
open_row_policy = true
# DDR4-2666 CL19 timings in controller cycles (tCK ≈ 0.75 ns):
#   tRCD (bank open)  ≈ 16 cyc
#   tRP  (bank close) ≈ 16 cyc
#   tCL  (CAS access) ≈ 17 cyc
bank_open_delay = 16
bank_close_delay = 16
access_cost = 17
intercommand_delay = 5
intercommand_delay_long = 5
intercommand_delay_short = 2.5
controller_delay = 20
refresh_interval = 64000000
refresh_length = 15
# Required bits for address parsing (log2 of the corresponding values)
required_bank_bits = 5              # log2(32) = 5
required_rank_bits = 1              # log2(2)  = 1
required_channel_bits = 2           # log2(4)  = 2
dram_page_size_bits = 7             # log2(128) = 7

[perf_model/dram/ddr]
# Mapping type: "open_page", "open_page_split_column", "closed_page", "xor"
address_mapping = xor

[perf_model/dram/ddr/open_page]
channel_bits = 2
rank_bits = 1
bank_bits = 5
page_size_bits = 7

[perf_model/dram/ddr/open_page_split_column]
column_offset = 3

[perf_model/dram/ddr/closed_page]
column_bits_shift = 2

[perf_model/dram/ddr/xor]
channel_bits = 2
rank_bits = 1
bank_bits = 5
page_size_bits = 7
xor_offset = 0

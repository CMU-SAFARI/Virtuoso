# DDR5-4800, 4-channel
# =====================
# Identical to ddr5_4800.cfg except num_channels=4 and the corresponding
# channel_bits widened to 2.  Per-channel timing parameters (CL40, banks
# per channel = 32 across 8 bank groups, etc.) are unchanged.

[perf_model/dram]
num_controllers = 1
type = ddr
latency = 80
chips_per_dimm = 8
dimms_per_controller = 2
localdram_size = 1024

[perf_model/dram/queue_model]
enabled = true
type = basic

[perf_model/dram/ddr]
# Per-channel bank structure (DDR5 JEDEC: 8 BG × 4 banks/BG = 32 banks)
num_banks = 32
num_bank_groups = 8
num_ranks = 2
num_channels = 4                    # 4 logical channels at the controller

# DDR5 speed
data_bus_width = 32
dram_speed = 4800

# Page/row buffer
dram_page_size = 128
open_page_mapping = true
randomize_address = false
randomize_offset = 0

# DDR5-4800 CL40 timings (ns)
bank_keep_open = 60000
bank_open_delay = 17                # tRCD ~16.67ns
bank_close_delay = 17               # tRP  ~16.67ns
access_cost = 17                    # tCL  ~16.67ns

# Inter-command delays
intercommand_delay = 4              # tCCD_L
intercommand_delay_long = 8         # tCCD_L_WR
intercommand_delay_short = 2        # tCCD_S

# Controller overhead
controller_delay = 15

# Refresh
refresh_interval = 32000000
refresh_length = 295

# Address mapping bit widths
column_bits_shift = 14
required_bank_bits = 5              # log2(32) = 5
required_rank_bits = 1              # log2(2)  = 1
required_channel_bits = 2           # log2(4)  = 2  (was 1 for 2-channel)
dram_page_size_bits = 7

# Row policy
constant_time_policy = false
selective_constant_time_policy = false
open_row_policy = true

#==============================================================================
# Address Mapping
#==============================================================================
[perf_model/dram/ddr]
address_mapping = xor

[perf_model/dram/ddr/xor]
channel_bits = 2                    # was 1
rank_bits = 1
bank_bits = 5
page_size_bits = 7
xor_offset = 0

[perf_model/dram/ddr/open_page]
channel_bits = 2                    # was 1
rank_bits = 1
bank_bits = 5
page_size_bits = 7

[perf_model/dram/ddr/closed_page]
column_bits_shift = 2

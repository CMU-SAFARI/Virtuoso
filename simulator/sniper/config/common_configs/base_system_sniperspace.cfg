# Base System Configuration
# =========================
# This file contains only the simulation basics.
# Core/cache settings are in core_configs/.
#
# Usage: Include this first, then a core_config, then scheme-specific configs.

[general]
total_cores = 1
native_environment = "true"
virtualized_environment = "false"
translation_enabled = "true"
enable_icache_modeling = false
enable_userspace_mimicos = false
exception_handler_type = "default"
# ---- Default disabled features ----

[perf_model/mimicos_host]
enabled = "false"
page_fault_latency = 0


[perf_model/dram/numa]
enabled = false

[perf_model/mmu]
sanity_checks_enabled = true

[scheduler]
type = static

# kcompactd - Memory Compaction Daemon
[perf_model/mimicos_host]
kcompactd_enabled = false
kcompactd_scan_interval_us = 10000
kcompactd_low_util_threshold = 0.25
kcompactd_high_util_threshold = 0.75
kcompactd_max_pages_per_scan = 512

# khugepaged - THP Coalescing Daemon
khugepaged_enabled = false
khugepaged_scan_interval_us = 10000
khugepaged_promotion_threshold = 0.95
khugepaged_max_promotions_per_scan = 16

# kswapd - Page Reclamation Daemon
kswapd_enabled = false
kswapd_scan_interval_us = 10000
kswapd_pages_high = 8192
kswapd_pages_low = 4096
kswapd_pages_min = 1024
kswapd_batch_size = 32

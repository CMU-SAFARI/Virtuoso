# Revelator spec-engine parameters (no allocator change)
# ========================================================
# Required when [perf_model/mmu/spec] type="revelator" is in play.  Ships
# the same hash/prediction knobs that the Revelator allocator uses, so the
# spec engine can be standalone (over a reserve_thp / utopia allocator).

[perf_model/revelator]
number_of_hashes = 1
number_of_predictions = 1
memory_size = 131072
kernel_size = 32768
oracle = "false"
max_order = 12
frag_type = "largepages"
target_fragmentation = 1.0
type = 0
filter = false
perfect_filtering = false
enable_aggressive_swapouts = false
infrequency_threshold = 5
hash1_usage_threshold = 0.7

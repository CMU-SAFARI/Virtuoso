# WayCastSpec selector — Phase 1b way-0 speculative prefetcher.
# Predicts way 0 of Utopia's RestSeg 0 (under tiered hashing, way 0 holds
# ~99% of pages) and fires handleMMUPrefetch on the L2 cache so the demand
# load merges with the in-flight MSHR rather than seeing an instantaneous
# fill.  Soft-disables when the active allocator isn't Utopia.

[perf_model/mmu/spec]
type = "waycast"

# Reserve THP allocator — 4KB-only variant
# Forces 4KB page sizes only; 2MB / huge pages disabled.

[perf_model/mimicos_host]
memory_allocator_type = "reserve_thp"
memory_allocator_name = "reserve_thp"
page_fault_handler = "default"
number_of_page_sizes = 1
page_size_list = 12
swap_enabled = false

[perf_model/reserve_thp]
memory_size = 131072
target_fragmentation = 0.0
kernel_size = 32768
max_order = 12
frag_type = "largepage"
threshold_for_promotion = 0.0
fragmentation_mode = "ratio"
target_free_2mb_pages = 0

# Revelator allocator — 4KB-only variant
# ========================================
# Used by V+R and V+T+R diamond cells so the Revelator spec engine's
# allocator-compatibility check passes and the engine actually fires
# (instead of soft-disabling and behaving as a no-op).

[perf_model/mimicos_host]
memory_allocator_type = "revelator"
memory_allocator_name = "revelator"
page_fault_handler = "default"
number_of_page_sizes = 1
page_size_list = 12
swap_enabled = false

[perf_model/revelator]
number_of_hashes = 1
number_of_predictions = 1
memory_size = 131072
kernel_size = 32768
oracle = "false"
max_order = 12
frag_type = "largepages"
target_fragmentation = 1.0
type = 0
filter = false
perfect_filtering = false
enable_aggressive_swapouts = false
infrequency_threshold = 5
hash1_usage_threshold = 0.7

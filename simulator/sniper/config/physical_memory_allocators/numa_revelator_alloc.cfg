
[perf_model/mimicos_host]
memory_allocator_type = "numa_revelator"
memory_allocator_name = "numa_revelator"
page_fault_handler = "default"
number_of_page_sizes = 2
page_size_list = 12, 21
swap_enabled = true

[perf_model/numa_revelator]
# --- Base Revelator knobs ---
number_of_hashes=1
number_of_predictions=1
memory_size=131072
kernel_size=32768
oracle="false"
max_order=12
frag_type= "largepages"
target_fragmentation=1.0
type=0
filter=false
perfect_filtering=false
enable_aggressive_swapouts=false
infrequency_threshold=5
hash1_usage_threshold=0.7

# --- NUMA-specific knobs ---
# Number of NUMA nodes
num_numa_nodes = 2

# NUMA placement policy: "local", "bind", "interleave", "preferred"
numa_policy = "local"

# Per-node utilization threshold [0.0-1.0]: above this, spill to other nodes
utilization_threshold = 0.85

# Maximum number of NUMA nodes to speculate over simultaneously
max_speculation_nodes = 2

# Per-node capacity in MB (comma-separated, one per node)
# If not specified, memory_size / num_numa_nodes is used for each
per_node_capacity_mb = "65536, 65536"

# Per-node kernel reservation in MB (comma-separated, one per node)
# A small portion of each node reserved for CPU-local kernel data
per_node_kernel_mb = "16384, 16384"

# Utopia allocator — 4KB-only configuration
# ============================================
# Single RestSeg of 4KB pages. RestSeg-0 (2MB) disabled.
# Useful for Phase 1b way-prediction experiments where the working set in
# 4KB-page units is much smaller than the RestSeg capacity, so tiered
# hashing has room to bias placement toward way 0.

[perf_model/mimicos_host]
memory_allocator_type = "utopia"
memory_allocator_name = "utopia"
page_fault_handler = "utopia"
number_of_page_sizes = 1
page_size_list = 12
swap_enabled = false

[general]
exception_handler_type = "utopia"

[perf_model/utopia/restseg]
# Single RestSeg: 8 GB of 4KB pages, 8-way associative.
# capacity = 8 GB / 4 KB = 2,097,152 pages
# num_sets = 2,097,152 / 8 = 262,144 sets
size = 8192
page_size = 12
assoc = 8

[perf_model/utopia]
enabled = "true"
restsegs = 1
fingerprint_bits = 4
fingerprint_enabled = 1
fp_speculation_enabled = false
adaptive_rsw_enabled = true
rsw_sequential_threshold = 0.90
rsw_warmup_accesses = 1000
tlb_eviction_thr = 2
pte_eviction_thr = 2
memory_size = 131072
kernel_size = 32768
max_order = 12
frag_type = "largepage"
target_fragmentation = 0.0
legacy_migration_enabled = 0
ptw_migration_threshold = 2
dram_accesses_migration_threshold = 2
thp_promotion_threshold = 0
threshold_for_promotion = 0.0

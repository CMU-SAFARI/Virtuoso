# L2-TLB CHiRP replacement policy — common baseline substrate
# ============================================================
# Makes CHiRP (control-flow-history-based dead-entry predictor, Vavouliotis
# et al.) the L2-TLB replacement policy. Intended to be #include'd AFTER an
# MMU config (mmu_base / mmu_base_prefetch / mmu_temporal_pte) so it overrides
# their default/LRU L2-TLB replacement policy.
#
# Used across the whole TLB-prefetch matrix so the replacement policy is held
# constant (CHiRP) and the only independent variable stays the TLB prefetcher.
# table_size/threshold reproduce the values already in mmu_base.cfg (and the
# code defaults), stated explicitly so no config relies on the implicit default.

[perf_model/mmu/tlb_level_2/tlb1]
replacement_policy = "chirp"

[perf_model/mmu/tlb_level_2/tlb1/chirp]
table_size = 1024
threshold = 2

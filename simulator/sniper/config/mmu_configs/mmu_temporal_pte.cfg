
# MMU configuration with Temporal PTE Prefetcher enabled.
# Based on mmu_base.cfg but with TLB prefetching enabled and
# the temporal_pte prefetcher (PTE-embedded delta+confidence payload).

[perf_model/mmu]
type="default"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false"
correct_prediction_latency=4
misprediction_latency=10
page_size_prediction_enabled=false

# PTW per-access logging (disabled by default, enable for detailed analysis)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100  # Log every Nth PTW access (1 = log all)


[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = true

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1

# ── L1 TLBs ──────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

# ── L2 TLB ───────────────────────────────────────────────────────────

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=2
page_size_list = 12,21
allocate_on_miss = "false"
access_latency = 12

# ── Superpage predictor ──────────────────────────────────────────────

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# ── TLB Prefetch Queue ──────────────────────────────────────────────

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1
level = 2

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency = 1
page_size = 2
page_size_list = 12,21
assoc = 2
number_of_prefetchers = 1
prefetcher_list = "temporal_pte"

# ── Temporal PTE Prefetcher configuration ────────────────────────────
#
# Encodes 4 signed delta-region entries × (18-bit offset + 2-bit confidence)
# in an 80-bit shadow payload spread across the PTE cache line.
#
# region_shift controls the prediction granularity:
#   region_shift=3 → 8 pages = 32KB (1 PTE cache line, 1 modeled walk)
#   region_shift=4 → 16 pages = 64KB (2 PTE cache lines, 2 modeled walks)
#   region_shift=5 → 32 pages = 128KB (4 PTE cache lines, 4 modeled walks)
#
# With region_shift=3, 18-bit signed offsets → ±128K regions = ±4GB.
# 4 slots capture more successors (top-1 is only ~14%, top-4 reaches ~40%).
#
# Each prediction fans out to 2^region_shift TLB entries.
# Hardware budget: 8 PTEs/cache line × 10 spare bits = 80 bits = 80 bits.
#
# Knobs summary:
#   num_offsets        – number of delta+conf slots per PTE
#   offset_bits        – bits for each signed delta (in region units)
#   conf_bits          – bits for each confidence counter
#   base_bit           – starting bit position in the 64-bit payload word
#   conf_threshold     – minimum confidence to issue a prefetch
#   max_prefetches     – max prefetch walks per demand access (each = region_pages PTEs)
#   page_shift         – log2(page_size), e.g. 12 for 4KB
#   region_shift       – log2(pages_per_region), e.g. 3 → 8 pages = 32KB regions
#   mode               – "pte_only" | "learn_pte_on_transitions" | "pc_cond_learn"
#   replacement        – "lowest_conf" | "random" | "lru"
#   conf_init          – initial confidence when inserting a new delta
#   enable_decay       – periodically halve all confidence counters
#   decay_period       – number of learning updates between decay sweeps
#   pc_tag_bits        – bits of PC tag for PC_COND_LEARN mode (0=disabled)
#   pc_table_size      – direct-mapped PC table size (power of 2)
#   reserve_global_slot – reserve last slot for global (non-PC) delta on PC miss
#   max_prefetch_depth – max chaining depth (0=no chaining, 1+=follow prefetched payloads)
#   prefetches_per_depth – max slots to follow at each chained depth level

[perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher]
num_offsets     = 4
offset_bits     = 18
conf_bits       = 2
base_bit        = 0
conf_threshold  = 2
max_prefetches_per_access  = 4
page_shift      = 12
region_shift    = 3
mode            = "learn_pte_on_transitions"
replacement     = "lowest_conf"
conf_init       = 1
enable_decay    = false
decay_period    = 1000
pc_tag_bits     = 64
pc_table_size   = 256
reserve_global_slot = true
max_prefetch_depth = 1
chain_edge_decay = 0.75       # Per-edge multiplicative decay factor (0-1) for chained path score
chain_score_threshold = 0.20  # Minimum accumulated path score to issue a chained prediction
chain_conf_threshold = 0      # Integer confidence floor for depth > 0 (0 = disabled, uses path-score only)
learn_on_hit   = false
prefetch_on_hit = true

# ── Confidence policy ─────────────────────────────────────────────────
# Selects how confidence counters are updated during learning.
#   "none"              – bump on match, no decay to other slots
#   "competitive"       – bump on match, linear decay of others (default)
#   "exponential"       – bump on match, halve (>>1) all others
#   "bump_only_strong"  – bump by 2 on match, no decay
# Parameters (used by 'competitive'; ignored by other policies):
#   conf_bump_amount    – increment on matching delta (default 1)
#   conf_decay_on_bump  – decrement to OTHER slots on match (default 1)
#   conf_decay_on_miss  – decrement to ALL slots when no match (default 1)
confidence_policy     = "competitive"
conf_bump_amount      = 1
conf_decay_on_bump    = 1
conf_decay_on_miss    = 1

# ── Stride direct prefetch ───────────────────────────────────────────
# When a stable page-level stride is detected, issue PTWTransparent
# walks directly for the next N pages along the stride.
#   stride_conf_threshold    – consecutive matching deltas needed to trust stride
#   stride_direct_prefetch   – master enable
#   stride_direct_degree     – how many stride-ahead pages to prefetch (lookahead)
stride_conf_threshold     = 3
stride_direct_prefetch    = false
stride_direct_degree      = 4

# ── Virtualized PC table ─────────────────────────────────────────────
# When enabled, evicted PC table entries are written back to an
# unlimited backing store (SW radix) so that per-PC stride state
# and last-region history survive cache evictions.  A small SRAM
# cache (pc_table_size) sits in front; misses probe the backing
# store and promote on hit.
#   virtualize_pc_table  – master enable (false = fixed-size cache only)
virtualize_pc_table       = false

# ── OS-managed side-table payload (alternative to PTE-embedded) ───────
# When enabled, the temporal payload is NOT stored in spare PTE bits but in a
# separate OS-managed table in DRAM, fetched IN PARALLEL with the page-table
# walk.  Translation latency is unchanged; the parallel access latency only
# delays when the prefetch is issued (its materialization timestamp).  This
# removes the PTE spare-bit constraint entirely (full-width payload).
# The access goes through the normal L1D->L2->LLC->DRAM hierarchy, so hot
# entries cache naturally (no separate on-chip structure).  The table is a
# 1 GB region reserved from the physical allocator at first use (same mechanism
# the HT/Cuckoo/HDC hash page tables use: handle_page_table_allocations), so
# side_table_base_pa is only a fallback if reservation is unavailable.
#   payload_in_side_table    – master enable (false = classic PTE-embedded)
#   side_table_base_pa       – fallback physical base (auto-reserved otherwise)
#   side_table_payload_bits  – bits stored per region entry; a 64B line packs
#                              512/payload_bits payloads (0 = auto = codec width,
#                              e.g. 80 bits for 4x(18-bit delta + 2-bit conf) → 6/line)
payload_in_side_table     = false
side_table_base_pa        = 128849018880   # fallback only; normally auto-reserved (1 GB)
side_table_payload_bits   = 0              # 0 = match the codec's actual payload width
# Side-car organization: radix (independent multi-level tree + own PWC) vs flat.
#   side_table_radix          – true = radix walk (sparse, realistic); false = flat 1-line lookup
#   side_table_levels         – radix depth: (levels-1) pointer levels + 1 leaf
#   side_table_bits_per_level – index bits consumed per level
#   side_table_pwc_entries    – side-car page-walk-cache size (caches upper-level nodes)
side_table_radix          = true
side_table_levels         = 3
side_table_bits_per_level = 9
side_table_pwc_entries    = 32

# ============================================================================
# Victima MMU Configuration
# Based on: "Victima: Drastically Increasing Address Translation Reach by
#            Leveraging Underutilized Cache Resources" (MICRO 2023)
# ============================================================================
#
# Victima repurposes L2 cache blocks to store clusters of TLB entries,
# providing an additional low-latency and high-capacity component to back up
# the last-level TLB and reduce page table walks.
#
# Key Components:
# 1. TLB Blocks: L2 cache blocks storing 8 contiguous TLB entries (64 bytes)
# 2. PTW Cost Predictor (PTW-CP): Identifies costly-to-translate pages
# 3. TLB-aware Cache Replacement: Modified SRRIP for TLB entries
#
# ============================================================================

[perf_model/mmu]
type = "victima"
page_table_walkers = 4
metadata_table_name = "none"
count_page_fault_latency = "false"
correct_prediction_latency = 4
misprediction_latency = 10
page_size_prediction_enabled = false

# PTW per-access logging (disabled by default)
ptw_access_logging = false
ptw_access_logging_sample_rate = 100

# ============================================================================
# Victima-specific Configuration
# ============================================================================

[perf_model/mmu/victima]
# Enable/disable Victima mechanism
enabled = true

# Insert TLB blocks on L2 TLB miss
insert_on_miss = true

# Insert TLB blocks on L2 TLB eviction (via background PTW)
insert_on_eviction = true

# Maximum number of TLB blocks in L2 cache
# Each block holds 8 TLB entries = 64 bytes
# 4096 blocks = 32K TLB entries
max_tlb_blocks = 4096

# TLB block lookup latency in nanoseconds
# This happens in parallel with L2 cache lookup
tlb_block_lookup_latency_ns = 2

# L2 cache MPKI threshold for bypassing PTW-CP
# If L2 cache MPKI > threshold, always insert TLB blocks
# (because caching data is not beneficial anyway)
l2_cache_mpki_threshold = 5

# ============================================================================
# PTW Cost Predictor (PTW-CP) Configuration
# ============================================================================
# Bounding box predictor: page is costly if (freq, cost) falls within box
# Default: freq ∈ [1, 12] AND cost ∈ [1, 7]

[perf_model/mmu/victima/ptw_cp]
# PTW frequency thresholds (3-bit counter, range 0-7)
freq_threshold_low = 1
freq_threshold_high = 12

# PTW cost thresholds (4-bit counter, range 0-15)
cost_threshold_low = 1
cost_threshold_high = 7

# ============================================================================
# TLB Subsystem Configuration
# ============================================================================

[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false

# ============================================================================
# Page Walk Cache Configuration
# ============================================================================

[perf_model/mmu/pwc]
enabled = true
levels = 3
entries = 32,32,32
associativity = 4,4,4
access_penalty = 1
miss_penalty = 1

# ============================================================================
# Level 1 TLBs (L1 iTLB + L1 dTLB for 4KB + L1 dTLB for 2MB)
# ============================================================================

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 32
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 128
assoc = 8
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

# ============================================================================
# Level 2 TLB (Unified, backs up L1 TLBs)
# This is the last-level TLB that Victima backs up
# ============================================================================

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 1536      # 1.5K entries (matches Intel Cascade Lake)
assoc = 12       # 12-way associative
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 12

# ============================================================================
# Superpage Prediction (optional)
# ============================================================================

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# ============================================================================
# TLB Prefetching (optional, can be combined with Victima)
# ============================================================================

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 0  # Disabled by default for Victima


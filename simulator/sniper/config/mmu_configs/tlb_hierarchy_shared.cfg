# Shared TLB hierarchy for the Phase 1 diamond — used by every cell so the
# only differences between cells are the mechanism knobs (Victima leaf
# probe, TRAIL prefetcher, Revelator engine, Utopia RestSeg), not the TLB
# geometry.
#
# Geometry: matches mmu_base.cfg (L2 TLB = 2048 entries, 8-way,
# allocate_on_miss=false, replacement_policy=lru).

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false
pagesize_predictor_name = "none"

[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/pwc]
enabled = true
levels = 3
entries = 32, 32, 32
associativity = 4, 4, 4
access_penalty = 1
miss_penalty = 1

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12, 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size = 2
page_size_list = 12, 21
allocate_on_miss = "false"
access_latency = 12
replacement_policy = "lru"

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

# TRAIL aggressive cfg — paper-best knobs (matches param-4c-trail-best from
# exp_prefetcher_comparison_4core_mc):
#   mode=pc_cond_learn, conf_init=3, max_prefetch_depth=3 (chained),
#   region_shift=5 (32-page = 128 KB regions), pc_table_size=64,
#   virtualize_pc_table=true, stride_direct=true, confidence_policy=none,
#   chain_edge_decay=0.75 per hop, chain_score_threshold=0.05.
#
# This file is self-contained so V+T cells (which don't include mmu_temporal_pte.cfg)
# get a complete prefetcher definition.

[perf_model/mmu/tlb_subsystem]
prefetch_enabled = true

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1
level = 2

[perf_model/mmu/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency = 1
page_size = 2
page_size_list = 12, 21
assoc = 2
number_of_prefetchers = 1
prefetcher_list = "temporal_pte"

[perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher]
# Base structural knobs (defaults from mmu_temporal_pte.cfg)
num_offsets = 4
offset_bits = 18
conf_bits = 2
base_bit = 0
conf_threshold = 2
max_prefetches_per_access = 4
page_shift = 12
replacement = "lowest_conf"
enable_decay = false
decay_period = 1000
pc_tag_bits = 64
chain_conf_threshold = 0
learn_on_hit = false
prefetch_on_hit = true
conf_bump_amount = 1
conf_decay_on_bump = 1
conf_decay_on_miss = 1
stride_conf_threshold = 3
stride_direct_degree = 4

# param-4c-trail-best overrides
mode = "pc_cond_learn"
conf_init = 3
pc_table_size = 64
max_prefetch_depth = 3
region_shift = 5
chain_edge_decay = 0.75
chain_score_threshold = 0.05
confidence_policy = "none"
reserve_global_slot = false
stride_direct_prefetch = true
virtualize_pc_table = true

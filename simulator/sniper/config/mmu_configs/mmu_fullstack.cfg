# Fullstack MMU Configuration
# ============================
# Knobs:
#   [perf_model/mmu/victima/enabled]   true → leaf-probe-first PTW on FlexSeg
#   [perf_model/mmu/spec/type]         "revelator" → speculation engine on
#   [perf_model/mmu/tlb_subsystem/prefetch_enabled] + temporal_pte block → TRAIL on
#   physical_memory_allocators choice → Utopia on (utopia.cfg) or off (reserve_thp.cfg)

[perf_model/mmu]
type = "fullstack"
page_table_walkers = 4
metadata_table_name = "none"
count_page_fault_latency = "false"
correct_prediction_latency = 4
misprediction_latency = 10
page_size_prediction_enabled = false
ptw_access_logging = false
ptw_access_logging_sample_rate = 100

[perf_model/mmu/victima]
enabled = true

# Parallel-probe model (tag-only peek): leaf-probe ∥ L2 TLB lookup, peek L2
# and NUCA tag arrays in parallel, no fill, no DRAM round-trip, no cache
# pollution.  Effective cycles charged on critical path per hit_where
# (already net of L2-TLB overlap).
parallel_probe = true
pp_eff_l2_cyc = 0
pp_eff_nuca_cyc = 8
pp_eff_miss_cyc = 3

# ---- TLB hierarchy (mirrors Utopia geometry) ----
[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false
pagesize_predictor_name = "none"

[perf_model/mmu/pwc]
enabled = true
levels = 3
entries = 32, 32, 32
associativity = 4, 4, 4
access_penalty = 1
miss_penalty = 1

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12, 21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size = 2
page_size_list = 12, 21
allocate_on_miss = "false"
access_latency = 12

# ---- Utopia metadata caches (used when Utopia allocator is in play) ----
[perf_model/utopia/tagcache]
size = 8
assoc = 4
access_penalty = 0
miss_penalty = 0

[perf_model/utopia/fpacache]
size = 8
assoc = 4
access_penalty = 0
miss_penalty = 0

[perf_model/utopia/mmu]
disable_fp_tar_caches = true
disable_fp_cache = true
disable_tar_cache = true

[perf_model/utopia]
radix_lookup_enabled = true
access_pattern_logging = false
access_pattern_sample_rate = 1

[perf_model/utopia/utlb]
enabled = true
entries = 4096
assoc = 8
latency = 1

# CATS speculation off — Revelator (when enabled) drives speculation instead.
[perf_model/utopia/speculation]
enabled = false
wmax = 4
conf_bits = 3
conf_threshold = 3
conf_table_entries = 16384
way_predictor_enabled = false
lastway_table_entries = 8192
enable_instruction_speculation = false

[perf_model/utopia/migration_cost_topk]
enabled = 0
page_size_bits = 12
score_bits = 10
ptw_base_increment = 1
dram_weighted_increment_cap = 3
topk_entries = 16
sticky_threshold = 2
cooldown_epochs = 2
ranking_epoch_translations = 1024
credit_epoch_translations = 1024
credits_max = 4
credits_refill = 1
migrate_threshold = 32
post_migrate_score_shift = 2

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

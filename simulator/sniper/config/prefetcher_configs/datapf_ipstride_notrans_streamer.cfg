# Data-side prefetch baseline — held CONSTANT across the TLB-prefetch study
# ==========================================================================
# IP-Stride at L1D + Streamer at L2.  (The L1D prefetcher operates purely on
# physical addresses and never triggers translations / TLB prefetches — that
# is now built-in; the old translate_prefetches path was removed.)
#
# Intended to be #include'd AFTER a core config (e.g. meteor_lake_pcore.cfg).
# run-sniper expands includes first and applies last-wins overrides, so this
# fragment overrides the core config's L2 cache prefetcher selection.
#
# The point: every config in the matrix (no-TLB-PF / ASP / TRAIL) gets the
# IDENTICAL data-side prefetching, so the only independent variable is the
# translation prefetcher in the L2-TLB PQ.

# ── L1D: IP-Stride, data-only (no translation-triggered TLB prefetch) ──
[perf_model/l1_dcache]
prefetcher = "ip_stride"

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 64
stop_at_page_boundary = "false"
lookahead = 4

# ── L2: Streamer (operates on physical addresses; no TLB interaction) ──
[perf_model/l2_cache]
prefetcher = "streamer"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

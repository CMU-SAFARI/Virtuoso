# Cascade Lake-SP Xeon Gold Configuration
# ========================================
# Target host: kratos20 — Intel Xeon Gold 6226R (Cascade Lake-SP, 2019).
# Base 2.9 GHz, max turbo 3.9 GHz, 16 cores / socket, SMT disabled.
# 32 KB L1d+L1i / core, 1 MB L2 / core, 22 MB L3 shared per socket.
#
# Forked from meteor_lake_pcore.cfg.  Deltas are:
#   • frequency 5.1 → 2.9 GHz            (match base clock on kratos20)
#   • L1d size/assoc/latency → CLX spec
#   • L1i size/assoc           → CLX spec
#   • L2 size                  → 1 MB (Meteor Lake has 2 MB)
#   • LLC (NUCA) size per core and latency → CLX spec (22 MB / 16 = 1408 KB)
#   • Pipeline widths scaled to Skylake-class (4-wide decode, 224 ROB, 97 RS)
# All other knobs (branch predictor, DVFS, prefetchers, NUCA policies)
# are inherited unchanged — tune as needed.

[core_debug]
name = "cascade_lake_xeon"

[perf_model/core]
frequency = 2.9              # Base clock on Xeon Gold 6226R
logical_cpus = 1             # SMT disabled on kratos20
core_model = "nehalem"       # Skylake family uses the same ROB-based model
type = "rob"

[perf_model/core/oneipc]
latency_cutoff = 1000

[perf_model/sync]
reschedule_cost = 1000

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = pentium_m
mispredict_penalty = 17      # Skylake-class front-end

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 72       # CLX load buffer
outstanding_stores = 56      # CLX store buffer
store_to_load_forwarding = true
address_disambiguation = true
rob_repartition = true
simultaneous_issue = true
commit_width = 4             # 4-wide retirement
rs_entries = 97              # CLX reservation station

[perf_model/core/interval_timer]
dispatch_width = 4           # 4-wide decode/dispatch (Skylake family)
window_size = 224            # 224-entry ROB

[dvfs]
transition_latency = 2000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 1.0                    # Cascade Lake nominal
technology_node = 14         # Intel 14nm++


## ---- Memory Subsystem ---- ##
## Cascade Lake: 32KB L1D, 32KB L1I (both 8-way), 1MB L2 per core,
## 22MB non-inclusive L3 shared across 16 cores per socket.

[perf_model/dram_directory]
total_entries = 16777216
associativity = 256

[perf_model/cache]
levels = 2
mshr_size = 64

[perf_model/l1_dcache]
perfect = false
cache_size = 32              # 32 KB L1D
associativity = 8            # 8-way
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4         # ~4 cyc (CLX L1d load-to-use)
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = "none"
outstanding_misses = 16

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 128
stop_at_page_boundary = "true"
lookahead = 8

[perf_model/l1_icache]
perfect = false
cache_size = 32              # 32 KB L1I
associativity = 8
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1

[perf_model/l2_cache]
cache_size = 1024            # 1 MB L2 per core (CLX)
associativity = 16
data_access_time = 14        # ~14 cyc L2 hit
tags_access_time = 2
prefetcher = "none"
writeback_time = 40
perf_model_type = parallel
writethrough = 0
shared_cores = 1
address_hash = "xor_mod"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l2_cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 6

## LLC (NUCA).  22 MB shared across 16 cores on CLX ⇒ 1408 KB per slice.
## CLX LLC load-to-use under modest contention is ~55 cyc (data) with
## ~15 cyc of tag pipeline; leave the 15-cyc tag time from the template.
[perf_model/nuca]
enabled = "true"
address_hash = "xor_mod"
cache_size = 1408            # 1408 KB per core × 16 = 22 MB total
associativity = 11           # CLX LLC is 11-way
replacement_policy = lru
tags_access_time = 15
data_access_time = 55
bandwidth = 128
[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false
epoch_instructions = 1000
tr_share_min = 0.01
rho_min = 0.02
meta_level_start = 2
meta_level_max = 15
data_pain_frac = 0.05
tr_gain_frac = 0.03
cooldown_epochs = 2
max_step_per_epoch = 1
ema_alpha = 0.2


[perf_model/cache_usage]
enabled = false

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024

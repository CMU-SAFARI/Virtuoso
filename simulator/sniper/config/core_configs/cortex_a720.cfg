# ARM Cortex-A720 (mobile mid OoO)
# ============================================================
# Auto-generated for the core-aggressiveness sweep.
# Sources: 7-CPU.com, Chips&Cheese, ARM TRMs, AndroidAuthority.
#
# Sniper modelling notes:
#   * in_order=False: rob-timer model is still used; in-order behaviour
#     is approximated by a tight ROB and narrow dispatch.
#   * outstanding_loads / outstanding_stores map to the LDQ / STQ.
#   * rs_entries maps to the integer scheduler.

[core_debug]
name = "cortex_a720"

[perf_model/core]
frequency = 3.0
logical_cpus = 1
core_model = "nehalem"
type = "rob"

[perf_model/core/oneipc]
latency_cutoff = 1000

[perf_model/sync]
reschedule_cost = 800

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = pentium_m
mispredict_penalty = 10

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 64
outstanding_stores = 48
store_to_load_forwarding = true
address_disambiguation = true
rob_repartition = true
simultaneous_issue = true
commit_width = 6
rs_entries = 64

[perf_model/core/interval_timer]
dispatch_width = 6
window_size = 160

[dvfs]
transition_latency = 1000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 0.85
technology_node = 4

## ---- Memory subsystem ---- ##

[perf_model/dram_directory]
total_entries = 16777216
associativity = 256

[perf_model/cache]
levels = 2
mshr_size = 32

[perf_model/l1_dcache]
perfect = false
cache_size = 64
associativity = 4
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = "ip_stride"
outstanding_misses = 32

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l1_dcache/prefetcher/ip_stride]
allocate_on_miss = "false"
num_prefetches = 4
num_streams = 128
stop_at_page_boundary = "false"
lookahead = 8

[perf_model/l1_icache]
perfect = false
cache_size = 64
associativity = 4
address_hash = "xor_mod"
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1

[perf_model/l2_cache]
cache_size = 512
associativity = 8
data_access_time = 6
tags_access_time = 2
prefetcher = "none"
writeback_time = 40
perf_model_type = parallel
writethrough = 0
shared_cores = 1
address_hash = "xor_mod"

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l2_cache/prefetcher/streamer]
allocate_on_miss = "true"
num_prefetches = 4
num_streams = 128
prefetch_front = 8
max_conf = 7
conf_thresh = 2

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 4
stop_at_page_boundary = false

[perf_model/l2_cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/l2_cache/qbs]
attempts = 6

[perf_model/nuca]
enabled = "true"
address_hash = "xor_mod"
cache_size = 2048
associativity = 16
replacement_policy = lru
tags_access_time = 15
data_access_time = 24
bandwidth = 128

[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false
epoch_instructions = 1000
tr_share_min = 0.01
rho_min = 0.02
meta_level_start = 2
meta_level_max = 15
data_pain_frac = 0.05
tr_gain_frac = 0.03
cooldown_epochs = 2
max_step_per_epoch = 1
ema_alpha = 0.2

[perf_model/cache_usage]
enabled = false

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024


# Configuration file for MimicOS using ReserveTHP allocator with 32GB memory
# This configuration sets up the memory allocator to use the ReserveTHP policy with a total kernel memory size of 32GB
# The total memory size is set to 128GB, with a maximum order of 12 (4MB pages)
# The fragmentation type is set to largepage, and the threshold for promotion is set to 0.0 to allow immediate promotion of pages

[allocator]
memory_allocator=reserve_thp
max_order = 12

[pmem_alloc]
memory_size = 131072
target_fragmentation = 1.0
target_memory = 0.0
fragmentation_file = ""
kernel_size = 32768
max_order = 12
frag_type = largepage
threshold_for_promotion= 1.1


[hugetlbfs]
enabled = false
nr_hugepages_2mb = 1024
nr_hugepages_1gb = 0
overcommit = false

[swap]
enabled = false
swap_size_mb = 4096

[daemons]
# kcompactd - Memory Compaction Daemon
kcompactd_enabled = false
kcompactd_scan_interval_us = 10000
kcompactd_low_util_threshold = 0.25
kcompactd_high_util_threshold = 0.75
kcompactd_max_pages_per_scan = 512

# khugepaged - THP Coalescing Daemon
khugepaged_enabled = false
khugepaged_scan_interval_us = 10000
khugepaged_promotion_threshold = 0.95
khugepaged_max_promotions_per_scan = 16

# kswapd - Page Reclamation Daemon
kswapd_enabled = false
kswapd_scan_interval_us = 10000
kswapd_pages_high = 8192
kswapd_pages_low = 4096
kswapd_pages_min = 1024
kswapd_batch_size = 32

# 2M pages only (reserve_thp promotes on first touch).
# MimicOS configuration for the *embedding library* (ChampSim / gem5 SE mode).
#
# Two things differ from the Sniper-side configs in this directory, and both
# matter:
#
# 1. memory_size must fit inside the host simulator's physical memory.  MimicOS
#    hands out frames from its own physical space; if that space is larger than
#    the simulated DRAM, it will eventually produce addresses the memory
#    controller cannot serve.  4 GB is safe for ChampSim's default 16 GiB DRAM
#    model and for a typical gem5 SE run.
#
# 2. [fault_calibration] means something different here.  In the standalone
#    kernel these values are *corrections* added on top of the fault-handling
#    code that SDE actually simulates instruction by instruction.  Under the
#    library MimicOS executes natively inside the host simulator and is never
#    simulated, so these values ARE the whole minor-fault cost model.  Leaving
#    them at zero (as every Sniper-side config in this directory does) makes
#    faults free; the host simulator then falls back to its own configured
#    minor-fault penalty and prints a warning.
#
#    The numbers below are a per-phase decomposition summing to ~2 000 ns for a
#    4 KiB anonymous write fault that has to install a page-table page.  Replace
#    them with your own measurements before quoting absolute latencies --
#    tools/fit_fault_model.py produces this section from eBPF traces.

[allocator]
memory_allocator = reserve_thp
max_order = 12

# Page-table geometry, read only by the embedding library.  It MUST match the
# host simulator's configured depth, or MimicOS builds a different tree than
# the one the host walks: ChampSim's virtual_memory.num_levels (5 by default),
# gem5's paging depth.  The standalone Sniper kernel ignores this section.
[page_table]
levels = 5
page_size = 4096

[pmem_alloc]
memory_size = 4096
kernel_size = 512
max_order = 12
frag_type = largepage
target_fragmentation = 0.0
threshold_for_promotion = 0.0

[hugetlbfs]
enabled = false

[swap]
enabled = false

[daemons]
kcompactd_enabled = false
khugepaged_enabled = false
kswapd_enabled = false

# ---- Minor-fault cost model (nanoseconds) ----
[fault_calibration]
phase_instrumentation_enabled = false
per_fault_logging_enabled = false
vma_lookup_base = 180
pt_page_alloc_cost = 420
phys_page_alloc_cost = 640
zero_fill_cost = 620
pte_install_cost = 140
lock_contention_penalty = 0
cache_tlb_perturb_penalty = 0
numa_penalty = 0

[fault_replay]
enabled = false

[scheduler]
policy = disabled

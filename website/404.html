<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Virtuoso</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.ico">
    <style>
        :root { --primary-color:#475569; --secondary-color:#f1f5f9; --text-color:#333; --heading-color:#1a1a1a; --border-color:#e0e0e0; --white-color:#fff; --badge-bg:#e2e8f0; --accent-color:#64748b; --shadow:0 4px 12px rgba(0,0,0,0.08); }
        html { font-size:16px; }
        body { font-family:'Poppins',sans-serif; margin:0; background:var(--secondary-color); color:var(--text-color); line-height:1.7; display:flex; flex-direction:column; min-height:100vh; }
        .site-header { background:var(--white-color); padding:1rem 0; box-shadow:0 2px 8px rgba(0,0,0,0.05); border-bottom:1px solid var(--border-color); }
        .nav-container { display:flex; justify-content:space-between; align-items:center; max-width:960px; margin:0 auto; padding:0 1rem; }
        .nav-logo { font-weight:700; font-size:1.2rem; color:var(--heading-color); text-decoration:none; }
        main { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:4rem 1rem; }
        .code { font-size:5rem; font-weight:700; color:var(--primary-color); line-height:1; margin:0; }
        h1 { font-size:1.6rem; color:var(--heading-color); margin:.6rem 0 0.4rem; }
        p { color:#555; max-width:460px; margin:0 auto 1.6rem; }
        .btn { display:inline-block; padding:.7rem 1.4rem; border-radius:10px; border:1px solid var(--primary-color); background:var(--primary-color); color:#fff; font-weight:700; text-decoration:none; }
        .btn:hover { filter:brightness(.93); }
        .btn-outline { background:#fff; color:var(--primary-color); margin-left:.6rem; }
        .site-footer { background:var(--heading-color); color:var(--secondary-color); text-align:center; padding:1.4rem 1rem; font-size:.85rem; }
        .site-footer a { color:var(--white-color); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-container"><a class="nav-logo" href="index.html">Virtuoso</a></div>
    </header>
    <main>
        <div>
            <p class="code">404</p>
            <h1>Page not found</h1>
            <p>The page you're looking for doesn't exist or has moved. The translation missed — no prefetcher can save this one.</p>
            <a class="btn" href="index.html">Back to home</a><a class="btn btn-outline" href="https://github.com/CMU-SAFARI/Virtuoso">GitHub</a>
        </div>
    </main>
    <footer class="site-footer"><p>SAFARI Research Group, ETH Zurich &amp; CMU</p></footer>
</body>
</html>

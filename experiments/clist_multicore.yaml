# Virtuoso Multicore Experiment Configuration
# =============================================
# Each experiment suite specifies a topology (ncores + network overrides),
# a trace_suite whose tlist has exactly ncores entries, and configs.
#
# The create_multicore_experiments.py script builds Sniper commands with:
#   -n <ncores>
#   --traces=t0,t1,...,tN-1     (comma-separated, one per core)
#   -s stop-by-icount-percore:<instruction_count>
#   --sim-end=last-restart
#   scheduler/type=static
#   general/num_host_cores=<ncores>     (barrier release rate)
#   SLURM -c <2*ncores+2>               (N sim + N trace + main + monitor)

# ============================================================
# Trace Suites
# ============================================================
# Each trace suite points to a tlist with exactly ncores entries.
# Homogeneous: same trace replicated per core.
# Heterogeneous: distinct traces per core.

trace_suite:
  # --- Homogeneous (rnd on all cores) ---
  homo_2core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_homo_2core.tlist

  homo_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_homo_4core.tlist

  homo_8core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_homo_8core.tlist

  homo_16core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_homo_16core.tlist

  # --- Heterogeneous (distinct traces per core) ---
  hetero_2core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_hetero_2core.tlist

  hetero_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_hetero_4core.tlist

  hetero_8core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_hetero_8core.tlist

  hetero_16core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_hetero_16core.tlist

  # --- Top 250 traces: google + victima (no gen/dlrm/sssp/gc), 2 mixes each ---
  top250_2core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_2core.tlist

  top250_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_4core.tlist

  top250_8core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_8core.tlist

  top250_16core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_16core.tlist

  # --- Top 250 Google-only + rnd.sift (no victima graph traces) ---
  top250_google_2core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_google_2core.tlist

  top250_google_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_google_4core.tlist

  top250_google_8core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_google_8core.tlist

  top250_google_16core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - multicore_top250_google_16core.tlist

  # --- Parametric multicore mixes (6 mixes, rnd.sift core 0 + Google) ---
  parametric_2core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - parametric_2core.tlist

  parametric_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - parametric_4core.tlist

  parametric_8core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - parametric_8core.tlist

  parametric_16core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - parametric_16core.tlist

  # --- Prefetcher comparison: 15 mixes from top-20 Trail (best) traces ---
  prefetcher_top20_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - prefetcher_top20_4core.tlist

  # --- v4-substrate DIVERSE mixes (16): CVP-int/fp + SPEC + Google + graph,
  #     anchored on strong single-core TRAIL gainers (3.3-6%+ band) ---
  prefetcher_v4_diverse_4core:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - prefetcher_v4_diverse_4core.tlist

  # 60 additional mixes from the same 30-trace gainer pool (distinct from the original 40)
  prefetcher_v4_diverse_4core_x60:
    tracelist_base_path: "vm_tlist/"
    tracelists:
      - prefetcher_v4_diverse_4core_x60.tlist

# ============================================================
# Topologies
# ============================================================
# Each topology defines ncores and Sniper -g overrides for
# total_cores, network model, scheduler, and host cores.

topologies:
  2core:
    ncores: 2
    description: "2-core, emesh_hop_counter"
    overrides:
      - "--general/total_cores=2"
      - "--network/memory_model_1=emesh_hop_counter"

  4core:
    ncores: 4
    description: "4-core, emesh_hop_counter, 2x2 mesh"
    overrides:
      - "--general/total_cores=4"
      - "--network/memory_model_1=emesh_hop_counter"

  8core:
    ncores: 8
    description: "8-core, emesh_hop_counter, 2x4 mesh"
    overrides:
      - "--general/total_cores=8"
      - "--network/memory_model_1=emesh_hop_counter"

  16core:
    ncores: 16
    description: "16-core, emesh_hop_counter, 4x4 mesh"
    overrides:
      - "--general/total_cores=16"
      - "--network/memory_model_1=emesh_hop_counter"

# ============================================================
# Configs
# ============================================================
configs:
  configs_base_path: "../simulator/sniper/config/address_translation_schemes/"

  reservethp-full-fragmentation:
    name: "reservethp-frag0.0"
    file: "reservethp.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Reservation-based THP allocator with full fragmentation (baseline)"

  reservethp-no-fragmentation:
    name: "reservethp-frag1.0"
    file: "reservethp.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=1.0"
    description: "Reservation-based THP allocator with no fragmentation"

  # --- Fast Detailed configs (simplified tag-only caches, no coherence) ---
  # Each core count has a full-fragmentation and no-fragmentation variant.

  fast-detailed-2c-full-frag:
    name: "fd-2c-frag0.0"
    file: "multicore/fast_detailed_baseline_2c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Fast detailed 2-core, 8MB L3, full fragmentation"

  fast-detailed-2c-no-frag:
    name: "fd-2c-frag1.0"
    file: "multicore/fast_detailed_baseline_2c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=1.0"
    description: "Fast detailed 2-core, 8MB L3, no fragmentation"

  fast-detailed-4c-full-frag:
    name: "fd-4c-frag0.0"
    file: "multicore/fast_detailed_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Fast detailed 4-core, 16MB L3, full fragmentation"

  fast-detailed-4c-no-frag:
    name: "fd-4c-frag1.0"
    file: "multicore/fast_detailed_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=1.0"
    description: "Fast detailed 4-core, 16MB L3, no fragmentation"

  fast-detailed-8c-full-frag:
    name: "fd-8c-frag0.0"
    file: "multicore/fast_detailed_baseline_8c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Fast detailed 8-core, 32MB L3, full fragmentation"

  fast-detailed-8c-no-frag:
    name: "fd-8c-frag1.0"
    file: "multicore/fast_detailed_baseline_8c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=1.0"
    description: "Fast detailed 8-core, 32MB L3, no fragmentation"

  fast-detailed-16c-full-frag:
    name: "fd-16c-frag0.0"
    file: "multicore/fast_detailed_baseline_16c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Fast detailed 16-core, 64MB L3, full fragmentation"

  fast-detailed-16c-no-frag:
    name: "fd-16c-frag1.0"
    file: "multicore/fast_detailed_baseline_16c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=1.0"
    description: "Fast detailed 16-core, 64MB L3, no fragmentation"

  # --- Fast Detailed frag=0.005 configs ---
  fast-detailed-2c-frag0.005:
    name: "fd-2c-frag0.005"
    file: "multicore/fast_detailed_baseline_2c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.005"
    description: "Fast detailed 2-core, 8MB L3, frag 0.005"

  fast-detailed-4c-frag0.005:
    name: "fd-4c-frag0.005"
    file: "multicore/fast_detailed_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.005"
    description: "Fast detailed 4-core, 16MB L3, frag 0.005"

  fast-detailed-8c-frag0.005:
    name: "fd-8c-frag0.005"
    file: "multicore/fast_detailed_baseline_8c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.005"
    description: "Fast detailed 8-core, 32MB L3, frag 0.005"

  fast-detailed-16c-frag0.005:
    name: "fd-16c-frag0.005"
    file: "multicore/fast_detailed_baseline_16c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.005"
    description: "Fast detailed 16-core, 64MB L3, frag 0.005"

  # --- Revelator 4KB-only configs (fast_detailed caching protocol) ---

  revelator-4kb-2c:
    name: "rev4kb-2c"
    file: "multicore/fast_detailed_revelator_4kb_2c.cfg"
    extends:
      - "--clock_skew_minimization/barrier/quantum=1000000000000"
    description: "Revelator 4KB-only, 2-core, 8MB L3"

  revelator-4kb-4c:
    name: "rev4kb-4c"
    file: "multicore/fast_detailed_revelator_4kb_4c.cfg"
    extends:
      - "--clock_skew_minimization/barrier/quantum=1000000000000"
    description: "Revelator 4KB-only, 4-core, 16MB L3"

  revelator-4kb-8c:
    name: "rev4kb-8c"
    file: "multicore/fast_detailed_revelator_4kb_8c.cfg"
    extends:
      - "--clock_skew_minimization/barrier/quantum=1000000000000"
    description: "Revelator 4KB-only, 8-core, 32MB L3"

  revelator-4kb-16c:
    name: "rev4kb-16c"
    file: "multicore/fast_detailed_revelator_4kb_16c.cfg"
    extends:
      - "--clock_skew_minimization/barrier/quantum=1000000000000"
    description: "Revelator 4KB-only, 16-core, 64MB L3"

  # --- ReserveTHP Fragmentation Sweep (2x memory for multicore) ---
  fd-fragsweep-2c:
    name: "fd-2c-fragsweep"
    file: "multicore/fast_detailed_baseline_2c.cfg"
    extends:
      - "--perf_model/reserve_thp/memory_size=262144"
      - "--perf_model/reserve_thp/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.005, 0.006, 0.007, 0.008, 0.009, 0.01]
    description: "2-core ReserveTHP frag sweep, 256GB mem"

  fd-fragsweep-4c:
    name: "fd-4c-fragsweep"
    file: "multicore/fast_detailed_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/memory_size=262144"
      - "--perf_model/reserve_thp/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.005, 0.006, 0.007, 0.008, 0.009, 0.01]
    description: "4-core ReserveTHP frag sweep, 256GB mem"

  fd-fragsweep-8c:
    name: "fd-8c-fragsweep"
    file: "multicore/fast_detailed_baseline_8c.cfg"
    extends:
      - "--perf_model/reserve_thp/memory_size=262144"
      - "--perf_model/reserve_thp/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.005, 0.006, 0.007, 0.008, 0.009, 0.01]
    description: "8-core ReserveTHP frag sweep, 256GB mem"

  # --- Revelator Utilization Sweep (2x memory for multicore) ---
  # target_fragmentation: 1.0 = 0% utilized, 0.0 = 100% utilized
  rev-utilsweep-2c:
    name: "rev4kb-2c-util"
    file: "multicore/fast_detailed_revelator_4kb_2c.cfg"
    extends:
      - "--perf_model/revelator/memory_size=262144"
      - "--perf_model/revelator/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
    description: "2-core Revelator utilization sweep, 256GB mem"

  rev-utilsweep-4c:
    name: "rev4kb-4c-util"
    file: "multicore/fast_detailed_revelator_4kb_4c.cfg"
    extends:
      - "--perf_model/revelator/memory_size=262144"
      - "--perf_model/revelator/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
    description: "4-core Revelator utilization sweep, 256GB mem"

  rev-utilsweep-8c:
    name: "rev4kb-8c-util"
    file: "multicore/fast_detailed_revelator_4kb_8c.cfg"
    extends:
      - "--perf_model/revelator/memory_size=262144"
      - "--perf_model/revelator/kernel_size=65536"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
    description: "8-core Revelator utilization sweep, 256GB mem"

  # --- Parametric baseline configs (parametric_dram_directory_msi, no fast_detailed) ---
  param-bl-2c:
    name: "param-bl-2c"
    file: "multicore/parametric_baseline_2c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.0, 0.005, 0.1]
    description: "Parametric baseline 2-core, frag sweep"

  param-bl-4c:
    name: "param-bl-4c"
    file: "multicore/parametric_baseline_4c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.0, 0.005, 0.1]
    description: "Parametric baseline 4-core, frag sweep"

  param-bl-8c:
    name: "param-bl-8c"
    file: "multicore/parametric_baseline_8c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.0, 0.005, 0.1]
    description: "Parametric baseline 8-core, frag sweep"

  param-bl-16c:
    name: "param-bl-16c"
    file: "multicore/parametric_baseline_16c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/reserve_thp/target_fragmentation="
        values: [0.0, 0.005, 0.1]
    description: "Parametric baseline 16-core, frag sweep"

  # --- Parametric revelator configs (parametric_dram_directory_msi, no fast_detailed) ---
  param-rev-2c:
    name: "param-rev-2c"
    file: "multicore/parametric_revelator_4kb_2c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.8, 0.6]
    description: "Parametric revelator 2-core, frag sweep"

  param-rev-4c:
    name: "param-rev-4c"
    file: "multicore/parametric_revelator_4kb_4c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.8, 0.6]
    description: "Parametric revelator 4-core, frag sweep"

  param-rev-8c:
    name: "param-rev-8c"
    file: "multicore/parametric_revelator_4kb_8c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.8, 0.6]
    description: "Parametric revelator 8-core, frag sweep"

  param-rev-16c:
    name: "param-rev-16c"
    file: "multicore/parametric_revelator_4kb_16c.cfg"
    sweeps:
      - identifier: "frag"
        option: "--perf_model/revelator/target_fragmentation="
        values: [1.0, 0.8, 0.6]
    description: "Parametric revelator 16-core, frag sweep"

  # --- Prefetcher Comparison 4-core configs (parametric caching protocol) ---

  param-4c-no-prefetch:
    name: "param-4c-nopf"
    file: "multicore/parametric_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Parametric 4-core, no TLB prefetching, frag=0.0"

  param-4c-asp:
    name: "param-4c-asp"
    file: "multicore/parametric_asp_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Parametric 4-core, ASP (PC-Stride) TLB prefetcher, frag=0.0"

  param-4c-dp:
    name: "param-4c-dp"
    file: "multicore/parametric_distance_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Parametric 4-core, Distance TLB prefetcher, frag=0.0"

  param-4c-dp-asp:
    name: "param-4c-dp-asp"
    file: "multicore/parametric_asp_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/number_of_prefetchers=2"
      - "--perf_model/mmu/tlb_prefetch/pq1/prefetcher_list=dp,asp"
    description: "Parametric 4-core, Distance + ASP combo, frag=0.0"

  param-4c-recency:
    name: "param-4c-recency"
    file: "multicore/parametric_recency_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Parametric 4-core, Recency TLB prefetcher, frag=0.0"

  param-4c-berti:
    name: "param-4c-berti"
    file: "multicore/parametric_asp_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/prefetcher_list=berti"
    description: "Parametric 4-core, Berti TLB prefetcher, frag=0.0"

  param-4c-atp:
    name: "param-4c-atp"
    file: "multicore/parametric_atp_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
    description: "Parametric 4-core, ATP TLB prefetcher, frag=0.0"

  param-4c-l2tlb-32k:
    name: "param-4c-l2tlb32k"
    file: "multicore/parametric_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_level_2/tlb1/size=32768"
      - "--perf_model/mmu/tlb_level_2/tlb1/assoc=16"
    description: "Parametric 4-core, L2 TLB 32K entries (no prefetching), frag=0.0"

  param-4c-l2tlb-64k:
    name: "param-4c-l2tlb64k"
    file: "multicore/parametric_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_level_2/tlb1/size=65536"
      - "--perf_model/mmu/tlb_level_2/tlb1/assoc=16"
    description: "Parametric 4-core, L2 TLB 64K entries (no prefetching), frag=0.0"

  param-4c-trail-best:
    name: "param-4c-trail-best"
    file: "multicore/parametric_temporal_pte_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/mode=pc_cond_learn"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/reserve_global_slot=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_init=3"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/max_prefetch_depth=3"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/pc_table_size=64"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/virtualize_pc_table=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/stride_direct_prefetch=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/confidence_policy=none"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/chain_score_threshold=0.05"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/region_shift=5"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/chain_edge_decay=0.75"
    description: "Parametric 4-core, Trail (best) TLB prefetcher, frag=0.0"

  param-4c-perfect-l2:
    name: "param-4c-perfect-l2"
    file: "multicore/parametric_baseline_4c.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/perfect_l2_tlb=true"
    description: "Parametric 4-core, Perfect L2 TLB (upper bound), frag=0.0"

# === v4-substrate 4-core configs (IP-Stride@L1D + Streamer@L2 + CHiRP@L2-TLB, 2MB NUCA) ===
  mc-v4-nopf:
    name: "mc-v4-nopf"
    file: "trail_comparison_v4/v4_noprefetch.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/nuca/cache_size=2048"
      - "--perf_model/dram/type=readwrite"

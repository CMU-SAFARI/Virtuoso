# Experiment suites
experiment_suites:

  prefetcher-comparison-v3:
    description: "Comprehensive TLB prefetcher comparison (frag=0.0)"
    configs:
      # Baselines & bounds
      - no-prefetch-frag0
      - perfect-l1-tlb-frag0
      - perfect-l2-tlb-frag0
      - l2-tlb-32k-frag0
      - l2-tlb-64k-frag0
      # Simple prefetchers
      - next-page-frag0
      - pc-stride-frag0
      - pc-stride-threshold-sweep-frag0
      - pc-stride-lookahead-sweep-frag0
      # Prior work
      - recency-frag0
      - recency-aggressive-frag0
      - dp-frag0
      - dp-large-table-frag0
      - recency-asp-combo-frag0
      - dp-asp-combo-frag0
      - atp-frag0
      - atp-aggressive-frag0
      - atp-fdt-sweep-frag0
      - atp-masp-sweep-frag0
      # Berti
      - berti-frag0
      - berti-aggressive-frag0
      - berti-asp-combo-frag0
      # ChIRP replacement
      - chirp-frag0
      - chirp-asp-frag0
      # Allocator
      - asap-frag0
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail_comparison_v4:
    description: "TRAIL vs baselines on the NEW substrate (IP-Stride@L1D + Streamer@L2 + CHiRP@L2-TLB). ASP-64 is the always-on baseline; prior-art prefetchers run as ASP+X combos; TRAIL runs standalone."
    configs:
      - v4-noprefetch        # floor (no L2-TLB prefetch)
      - v4-perfect-l2tlb     # ceiling
      - v4-asp               # baseline: ASP-64 alone
      - v4-asp-stride        # ASP + next-page stride
      - v4-asp-recency       # ASP + Recency
      - v4-asp-dp            # ASP + Distance
      - v4-asp-atp           # ASP + ATP
      - v4-asp-berti         # ASP + Berti
      - v4-trail             # TRAIL (standalone, PTE-embedded)
      - v4-trail-sidecar     # TRAIL (standalone, OS radix side-car)
      - v4-asp-frag0.005     # ASP-64 baseline at frag=0.005 (vs 0.0)
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  pq_sweep_2mb:
    description: "PQ-size sweep @2MB NUCA, fixed binary: TRAIL and ASP at PQ {0=cache-only/PTE-only, 64,128,256,512,1024}. Tests whether the win is PQ-install or PTE cache-warming."
    configs:
      - trail-pqsweep-cacheonly
      - trail-pqsweep
      - asp-pqsweep-cacheonly
      - asp-pqsweep
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  v4_comparison_2mb_strong:
    description: "DEFINITIVE v4 comparison @2MB NUCA, fixed binary (no-alloc prefetch), with STRONGEST ATP/DP/Recency. TRAIL vs best-tuned competitors under high LLC pressure."
    configs:
      - v4-noprefetch-nuca2mb        # floor
      - v4-perfect-l2tlb-nuca2mb     # ceiling
      - v4-asp-nuca2mb               # baseline
      - v4-asp-stride-nuca2mb        # ASP + next-page stride
      - v4-asp-recency-strong-nuca2mb  # STRONGEST recency
      - v4-asp-dp-strong-nuca2mb       # STRONGEST DP (16KiB)
      - v4-asp-atp-strong-nuca2mb      # STRONGEST ATP (16KiB)
      - v4-asp-berti-nuca2mb         # Berti (default)
      - v4-trail-nuca2mb             # TRAIL (standalone)
      - v4-trail-sidecar-nuca2mb     # TRAIL (side-car)
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail_comparison_v4_nuca2mb:
    description: "trail_comparison_v4 lineup rerun at 2MB NUCA (high LLC pressure): same 11 eval points, nuca/cache_size=2048"
    configs:
      - v4-noprefetch-nuca2mb
      - v4-perfect-l2tlb-nuca2mb
      - v4-asp-nuca2mb
      - v4-asp-stride-nuca2mb
      - v4-asp-recency-nuca2mb
      - v4-asp-dp-nuca2mb
      - v4-asp-atp-nuca2mb
      - v4-asp-berti-nuca2mb
      - v4-trail-nuca2mb

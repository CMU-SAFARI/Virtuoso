  # ==========================================================================
  # DP (distance prefetcher) mechanism study — STANDALONE (v4_dp.cfg, no ASP).
  # Three 1-D sweeps crossing at the default point (rows=256, slots=8, depth=1):
  #   dp-rows : table capacity 64..16384 (16384 = oracle-capacity point;
  #             v4 data shows 99.3% row-replacement thrash at 256 on bc)
  #   dp-slots: prediction breadth 1..16 per trigger (precision vs PQ spam)
  #   dp-depth: chained Markov walk via MRU successor (max_depth, NEW knob) —
  #             the "generous DP" chaining extension; depth1 == original DP
  # ==========================================================================
  dp-rows-sweep:
    name: "dp-rows"
    file: "trail_comparison_v4/v4_dp.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/num_slots=8"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/assoc=4"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/max_depth=1"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/model_prefetch_walks=true"
    sweeps:
      - identifier: ["rows"]
        option: ["--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/num_rows="]
        values: [[64, 256, 1024, 4096, 16384]]
    description: "DP standalone: distance-table capacity sweep 64..16K rows (16K = oracle capacity)"
  dp-slots-sweep:
    name: "dp-slots"
    file: "trail_comparison_v4/v4_dp.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/num_rows=256"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/assoc=4"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/max_depth=1"
      - "--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/model_prefetch_walks=true"
    sweeps:
      - identifier: ["slots"]
        option: ["--perf_model/mmu/tlb_prefetch/pq1/dp_prefetcher/num_slots="]
        values: [[1, 2, 4, 16]]
    description: "DP standalone: successor breadth sweep 1/2/4/16 slots (8 = default in rows sweep)"

      - v4-asp-frag0.005-nuca2mb
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  recency-mechanism:
    description: "Recency hop decomposition ONLY (standalone, same/minus1/plus1 x chase on/off, on-hit). No TRAIL configs. Baselines: frozen exp_baseline_icache_on/off; TRAIL reference: existing v4-trail results."
    configs:
      - v4rec-all
      - v4rec-same
      - v4rec-plus1
      - v4rec-minus1
      - v4rec-same-plus1
      - v4rec-all-freechase
      - v4rec-minus1-freechase
      - v4rec-all-onhit
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  dp-mechanism:
    description: "DP mechanism study (standalone): table capacity 64..16K x breadth 1..16 x chained depth 1..3 (three 1-D sweeps crossing at 256/8/d1). Baselines: frozen exp_baseline_icache_on/off."
    configs:
      - dp-rows-sweep
      - dp-slots-sweep
      - dp-depth-sweep
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  competitor-tuning-16kb:
    description: "Iso-HW-budget (~16 KiB) tuning of ASP+ATP / ASP+Berti / ASP+DP. ATP: MASP(1792) x lookahead{1,4,8} x degree{1,3,6}; Berti: 16KiB x max_burst{3,6}; DP: 16KiB(576x8) x max_depth{1,2,3}. Find each scheme's strongest version. Baselines: frozen exp_baseline_icache_on/off."
    configs:
      - atp-16kb-la1

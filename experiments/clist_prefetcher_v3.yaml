    instruction_count: 2000000

  prefetcher-xsbench-test:
    description: "Aggressive test on XSBench (10M instructions, all prefetchers)"
    configs:
      - no-prefetch-frag0
      - next-page-frag0
      - pc-stride-frag0
      - pc-stride-threshold-sweep-frag0
      - pc-stride-lookahead-sweep-frag0
      - recency-frag0
      - dp-frag0
      - atp-frag0
      - berti-frag0
      - berti-aggressive-frag0
      - perfect-l2-tlb-frag0
    trace_suite: xsbench
    instruction_count: 10000000

  # ==========================================================================
  # Trail + ASAP Orthogonality
  # ==========================================================================
  # Shows that Trail (TLB prefetching) and ASAP (eager THP allocation) are
  # orthogonal: baseline, Trail-only, ASAP-only, Trail+ASAP combo.

  trail-asap-orthogonality:
    description: "Trail + ASAP orthogonality (4 configs, top250 traces, 300M instr)"
    configs:
      - no-prefetch-frag0
      - asap-frag0
      - trail-best-frag0
      - trail-asap-frag0
    trace_suite: top250
    instruction_count: 300000000
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail-asap-combo-only:
    description: "Trail+ASAP combo only (resubmit after fix)"
    configs:
      - trail-asap-frag0
    trace_suite: top250
    instruction_count: 300000000
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail-pte-bit-budget:
    description: "Trail (best) PTE spare-bit budget sweep: 2/4/6 bits/PTE (1/2/3 deltas, 14b+2b each)"
    configs:
      - trail-best-pte2b
      - trail-best-pte4b
      - trail-best-pte6b
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]   # required: srv is the only family with I-side translation; matches frozen icache-on baselines
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  # ==========================================================================
  # FROZEN BASELINE REFERENCES — run ONCE, reuse as constant baseline columns.
  # Do NOT bundle these configs into comparison suites; comparison suites should
  # run only their NEW configs and join against these.
  #   3 configs {no-prefetch, ASP, perfect-L2TLB} x 2 icache settings = 6 datasets.
  #   icache-on  = enable_icache_for:[srv]  (matches trail_comparison_v4; srv is the
  #                only family with nonzero instruction-side translation, so on-for-srv
  #                is identical in effect to on-for-all but cheaper).
  #   icache-off = no override -> base default enable_icache_modeling=false everywhere.
  # VALID ONLY while the Sniper binary + v4 substrate + top250 trace set + instruction
  # counts are unchanged. Stamp lib/sniper mtime when frozen; regenerate on rebuild.
  # ==========================================================================
  baseline-icache-on:
    description: "FROZEN baselines WITH icache modeling (enable_icache_for srv): no-prefetch, ASP, perfect-L2TLB on v4 substrate"
    configs:
      - v4-noprefetch
      - v4-asp
      - v4-perfect-l2tlb
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  baseline-icache-off:
    description: "FROZEN baselines WITHOUT icache modeling (default off everywhere): no-prefetch, ASP, perfect-L2TLB on v4 substrate"
    configs:
      - v4-noprefetch
      - v4-asp
      - v4-perfect-l2tlb
    trace_suite: top250
    instruction_count: 300000000
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  nuca-size-sweep:
    description: "NUCA size sweep 2..32MB x {ASP, ASP+Berti, TRAIL-best} = 15 pts"
    configs:
      - asp-nuca-sweep
      - berti-nuca-sweep
      - trail-nuca-sweep
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  pq-size-sweep:
    description: "L2-TLB PQ size sweep 64..1024 x {ASP baseline, TRAIL-best} = 10 pts, + PQ=0 cache-only {ASP, TRAIL}"
    configs:
      - asp-pq-sweep
      - trail-pq-sweep
      - asp-pq-nopq
      - trail-pq-nopq
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail-pte-budget-grid:
    description: "Trail-best PTE-embedded payload grid: slots 1..4 x delta 14..18b (conf 2b) = 20 pts, 2..10 bits/PTE"
    configs:
      - trail-pte-grid
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:

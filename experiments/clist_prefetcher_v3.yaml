      - atp-16kb-la8
      - berti-16kb
      - dp-16kb
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail-ablations-2mb:
    description: "TRAIL-best ablations @ 2MB NUCA: reference, stride-off, cache-only (no PQ install), payload-writeback-on"
    configs:
      - trail-abl-ref-2mb
      - trail-abl-nostride-2mb
      - trail-abl-cacheonly-2mb
      - trail-abl-wb-2mb
    trace_suite: top250
    instruction_count: 300000000
    enable_icache_for: ["srv"]
    slurm_partitions: ["cpu_part", "bio_part"]
    instruction_count_overrides:
      top250_virtuoso.tlist: 100000000

  trail_comparison_v4_smoke:
    description: "Smoke for trail_comparison_v4 (1M instr, single Google trace)"
    configs:
      - v4-asp
      - v4-asp-recency
      - v4-asp-atp
      - v4-trail
    trace_suite: google_delta_single
    instruction_count: 1000000

  prefetcher-comparison-v3-smoke:
    description: "Quick smoke test for prefetcher comparison v3 (2M instr, randacc)"
    configs:
      - no-prefetch-frag0
      - next-page-frag0
      - pc-stride-frag0
      - recency-frag0

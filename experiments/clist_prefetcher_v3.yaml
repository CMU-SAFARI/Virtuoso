  # ==========================================================================
  # Side-table-ONLY payload-size sweep (radix side-car, 256-bit payload word)
  # Sweep num_offsets 1..8 with 18-bit deltas + 2-bit confidence (20-bit slots):
  #   noff=1 -> 20b  (~2 bits/PTE)   ...   noff=8 -> 160b (20 bits/PTE, 8x[18+2])
  # payload_in_side_table=true (no PTE-embedded path); side_table_radix=true;
  # side_table_payload_bits=0 so the side-car packs 512/payload_bits per 64B line.
  # ==========================================================================
  trail-sidecar-payload-sweep:
    name: "trail-sc-pl"
    file: "trail_comparison_v4/v4_trail_sidecar.cfg"   # v4 substrate: IP-Stride@L1D + Streamer@L2 + CHiRP@L2-TLB
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/mode=pc_cond_learn"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/reserve_global_slot=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_init=3"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/max_prefetch_depth=3"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/pc_table_size=64"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/virtualize_pc_table=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/stride_direct_prefetch=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/confidence_policy=none"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/chain_score_threshold=0.05"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/region_shift=5"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/chain_edge_decay=0.75"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/payload_in_side_table=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/side_table_radix=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/side_table_payload_bits=0"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/offset_bits=18"
      # Competitive confidence (overrides the confidence_policy=none above): on a
      # delta hit, bump the winner and DECAY the other deltas; decay all on a
      # miss.  Required for conf_init=max + threshold=50% to mean anything (else
      # every delta pins at max and the confidence width/eviction is inert).
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/confidence_policy=competitive"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_bump_amount=1"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_decay_on_bump=1"
      - "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_decay_on_miss=1"
    sweeps:
      # 2-D grid: payload size (num_offsets, 18b deltas) x confidence width.
      # Dim 1: num_offsets 1..8 (= 20..160b @ conf_bits=2).
      # Dim 2: confidence width, with conf_init=max(2^cb-1) and
      #        conf_threshold=50%(2^(cb-1)) scaled together per conf_bits.
      #        cb=2 -> init 3, thr 2 ; cb=3 -> init 7, thr 4 ; cb=4 -> init 15, thr 8
      #        (swept conf_init overrides the conf_init=3 in extends, last-wins).
      - identifier: ["noff"]
        option: ["--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/num_offsets="]
        values: [[1, 2, 3, 4, 5, 6, 7, 8]]
      - identifier: ["cb", "ci", "ct"]
        option: ["--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_bits=",
                 "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_init=",
                 "--perf_model/mmu/tlb_prefetch/pq1/temporal_pte_prefetcher/conf_threshold="]
        values: [[2, 3, 4], [3, 7, 15], [2, 4, 8]]
    description: "Side-table-only (radix side-car) payload x confidence grid: num_offsets 1..8 (18b deltas) x conf_bits 2/3/4 (init=max, thr=50%) = 24 points"


  # ==========================================================================
  # Recency mechanism study — STANDALONE recency (v4_recency.cfg, no ASP layer)
  # Hop decomposition: same = Y.prev (free), plus1 = Y.next (free),
  # minus1 = Y.prev.prev (the only CHAINED hop; +1 serialized pointer chase).
  # Free-chase ablation (model_pointer_chase=false) separates signal quality
  # from traversal cost (chases are only charged for minus1).
  # TRAIL depth 1/2/3 (max_prefetch_depth) is the chaining counterpoint.
  # ==========================================================================
  v4rec-all:
    name: "v4rec-all"
    file: "trail_comparison_v4/v4_recency.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_same_recency=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_minus_1=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_plus_1=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/model_pointer_chase=true"
    description: "recency standalone: same+minus1+plus1, chases modeled (canonical)"
  v4rec-same:
    name: "v4rec-same"
    file: "trail_comparison_v4/v4_recency.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_same_recency=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_minus_1=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_plus_1=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/model_pointer_chase=true"
    description: "recency standalone: same-recency hop only (free, in PTE(Y))"
  v4rec-plus1:
    name: "v4rec-plus1"
    file: "trail_comparison_v4/v4_recency.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_same_recency=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_minus_1=false"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/prefetch_recency_plus_1=true"
      - "--perf_model/mmu/tlb_prefetch/pq1/recency_prefetcher/model_pointer_chase=true"
    description: "recency standalone: plus1 hop only (free, in PTE(Y))"
  v4rec-minus1:
    name: "v4rec-minus1"
    file: "trail_comparison_v4/v4_recency.cfg"
    extends:
      - "--perf_model/reserve_thp/target_fragmentation=0.0"
